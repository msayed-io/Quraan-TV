name: Android Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Bootstrap Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x ./gradlew ]]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Derive Android version from Tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
            echo "Tag must use semantic version format vMAJOR.MINOR.PATCH, got: $GITHUB_REF_NAME"
            exit 1
          }
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version_code=$((major * 10000 + minor * 100 + patch))
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "Android versionName=$version versionCode=$version_code"

      - name: Validate required release secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" ]] || { echo 'Missing KEYSTORE_BASE64'; exit 1; }
          [[ -n "$STORE_PASSWORD" ]] || { echo 'Missing STORE_PASSWORD'; exit 1; }
          [[ -n "$KEY_PASSWORD" ]] || { echo 'Missing KEY_PASSWORD'; exit 1; }

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
          chmod 600 "$GITHUB_WORKSPACE/my-upload-key.jks"
          test -s "$GITHUB_WORKSPACE/my-upload-key.jks"

      - name: Verify keystore alias
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias upload \
            >/tmp/keystore-details.txt
          grep -q 'Alias name: upload' /tmp/keystore-details.txt

      - name: Run unit tests
        continue-on-error: true
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew test --stacktrace

      - name: Assemble signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${VERSION_CODE:-}" ]]; then
            ./gradlew clean assembleRelease \
              -PversionCode="$VERSION_CODE" \
              -PversionName="$VERSION_NAME" \
              --stacktrace
          else
            ./gradlew clean assembleRelease --stacktrace
          fi

      - name: Verify APK and print checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          (( ${#apks[@]} > 0 )) || { echo 'Release APK was not produced'; exit 1; }
          cp "${apks[0]}" Quraan-TV-Lite.apk
          echo "APK: Quraan-TV-Lite.apk"
          sha256sum Quraan-TV-Lite.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quraan-TV-Lite
          path: Quraan-TV-Lite.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Quraan-TV-Lite.apk \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" Quraan-TV-Lite.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "Quraan-TV-Lite $GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$GITHUB_WORKSPACE/my-upload-key.jks"
